[package]
name = "lucid-compiler"
version = "0.1.0"
edition = "2021"

[features]
default = []
cuda = ["candle-core/cuda"]
metal = ["candle-core/metal"]

[dependencies]
logos = "0.13"
chumsky = "0.9"
im = "15.1"

# ML/Tensor support
ndarray = "0.15"
ndarray-rand = "0.14"
rand = "0.8"

# GPU acceleration (optional)
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }

# Serialization for model saving
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

[[example]]
name = "tiny_chatbot"
required-features = []

[[example]]
name = "tinybert_train"
required-features = []
