[package]
name = "lucid-compiler"
version = "0.1.0"
edition = "2021"

[dependencies]
logos = "0.13"
chumsky = "0.9"
im = "15.1"

# ML/Tensor support
ndarray = "0.15"
ndarray-rand = "0.14"
rand = "0.8"

# Serialization for model saving
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
